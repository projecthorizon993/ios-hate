// Version catalog is the single place to bump the toolchain. See docs/ARCHITECTURE.md
// section 8 for why each of these versions is pinned.
[versions]
agp = "8.13.2"
kotlin = "2.3.21"
coroutines = "1.8.1"
activityCompose = "1.9.3"
coreKtx = "1.13.1"
lifecycle = "2.8.7"
composeBom = "2026.06.01"
# CameraX must be 1.6+. From 2026-11-01 extensions support is removed on some devices
# for 1.5 and earlier, and 1.6.0 dropped ImageAnalysis whenever an extension is enabled.
camerax = "1.6.2"
# LiteRT 1.4.2 is the last line where the documented Interpreter + GPU delegate path
# works. LiteRT Maven v2 exposes the Interpreter API as CPU only.
litert = "1.4.2"
junit = "4.13.2"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
androidx-camera-extensions = { module = "androidx.camera:camera-extensions", version.ref = "camerax" }

litert = { module = "com.google.ai.edge.litert:litert", version.ref = "litert" }
litert-gpu = { module = "com.google.ai.edge.litert:litert-gpu", version.ref = "litert" }
litert-gpu-api = { module = "com.google.ai.edge.litert:litert-gpu-api", version.ref = "litert" }

# CameraX exposes ListenableFuture in its public API (ProcessCameraProvider.getInstance,
# ExtensionsManager.getInstanceAsync). Declared explicitly so the compile classpath does
# not depend on it being an `api` dependency transitively.
listenablefuture = { module = "com.google.guava:listenablefuture", version = "1.0" }

junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
