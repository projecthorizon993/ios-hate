name: iOS

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "fresh-rewrite"
      - "avfoundation-core"
    paths-ignore:
      - "android/**"
      - "docs/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "main"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    # macos-14 defaults to Xcode 15.4 and is unsupported from 2026-11-02.
    # macos-15 defaults to Xcode 16.4 and also has Xcode 26.3 installed.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify project file matches disk
        run: node scripts/generate-pbxproj.mjs --check

      - name: Validate project file structure
        run: node scripts/validate-pbxproj.mjs

      - name: Check Swift source balance
        run: node scripts/check-swift-balance.mjs

      # Before the compiler, not after. A Swift file that is not valid UTF-8 produces
      # "error: invalid UTF-8 found in source file" pointing at a comment, with nothing in
      # the message about encoding — two CI runs were spent reading that as a toolchain
      # problem before a single stray 0x97 byte was found by hand. This names the file and
      # the exact offset.
      - name: Check Swift source encoding
        run: node scripts/check-swift-encoding.mjs

      - name: Select a simulator
        id: sim
        run: |
          set -euo pipefail
          xcodebuild -version
          UDID="$(xcrun simctl list devices available \
            | grep -E 'iPhone' \
            | grep -Eo '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' \
            | head -1)"
          if [ -z "$UDID" ]; then
            echo "no available iPhone simulator on this runner" >&2
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "using simulator $UDID"

      - name: Run unit tests
        run: |
          set -uo pipefail
          DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          # Stamped into Info.plist as LumaFrameBuild, so the log file the user sends back
          # names the build it came from. The run number goes first because it is the
          # part that increments by one on every single build: `138-2ff7527` reads as
          # "build 138" at a glance and pins the commit exactly.
          LUMAFRAME_BUILD="${{ github.run_number }}-${GITHUB_SHA::8}"
          set +e
          xcodebuild test \
            -project LumaFrame.xcodeproj \
            -scheme LumaFrame \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            LUMAFRAME_BUILD="$SHORT_SHA" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            # The compiler output is behind auth, so it is also published as step-summary
            # text and as check annotations. Both are readable from the API without a
            # token, which is the difference between "CI is red" and knowing why.
            LOG="$RUNNER_TEMP/xcodebuild-test.log"
            {
              echo "### Swift compiler diagnostics"
              grep -E "error:|warning:|XCTAssert|Testing failed|Testing cancelled" "$LOG" | sort -u || true
              echo
              echo "<details><summary>Last 150 lines of xcodebuild output</summary>"
              echo
              echo '```'
              tail -n 150 "$LOG"
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"

            ERRORS="$(grep -E "error:" "$LOG" | sort -u || true)"
            if [ -n "$ERRORS" ]; then
              echo "$ERRORS" | while IFS= read -r diagnostic; do
                printf '::error title=Swift compiler::%s\n' "$diagnostic"
              done
            else
              # A failure with no "error:" line is a test failure, a link failure or a
              # toolchain problem. The tail is the only way to tell them apart, so it is
              # published as one annotation rather than leaving the run unexplained.
              tail -n 60 "$LOG" | tr '\n' '\036' | sed 's/\x1E/\\n/g' | tr '\036' '\n' \
                | fold -w 900 | while IFS= read -r chunk; do
                  printf '::error title=xcodebuild output (tail)::%s\n' "$chunk"
                done
            fi
            exit "$STATUS"
          fi

      - name: Upload test log
        if: always()
        # A log upload is diagnostics, not a deliverable. It must never be the reason a
        # run reports failure, and GitHub's artifact service does intermittently time
        # out on an 8 KB file.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: LumaFrame-iOS-Test-Log
          path: ${{ runner.temp }}/xcodebuild-test.log
          if-no-files-found: warn

  build:
    name: Build unsigned IPA
    # Deliberately not `needs: test`. The unit tests and the IPA are independent
    # questions, and the IPA is what gets installed on a device to check real camera
    # behaviour, so a red test run must not be the reason there is nothing to install.
    # Both jobs fail loudly on their own if their own step fails.
    if: ${{ !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check Swift source encoding
        run: node scripts/check-swift-encoding.mjs

      - name: Verify Xcode toolchain and scheme
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -list -project LumaFrame.xcodeproj

      - name: Compile unsigned iOS application
        run: |
          set -euo pipefail
          DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          rm -rf "$DERIVED_DATA"
          set +e
          xcodebuild \
            -project LumaFrame.xcodeproj \
            -scheme LumaFrame \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            LUMAFRAME_BUILD="${{ github.run_number }}-${GITHUB_SHA::8}" \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_STATUS" -ne 0 ]; then
            {
              echo "### Swift compiler diagnostics"
              grep -E "error:|warning:" "$RUNNER_TEMP/xcodebuild.log" || true
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E "error:" "$RUNNER_TEMP/xcodebuild.log" | while IFS= read -r diagnostic; do
              printf '::error title=Swift compiler::%s\n' "$diagnostic"
            done
            exit "$BUILD_STATUS"
          fi

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/LumaFrame.app"
          IPA_ROOT="$RUNNER_TEMP/UnsignedIPA"
          test -d "$APP_PATH"
          rm -rf "$IPA_ROOT"
          mkdir -p "$IPA_ROOT/Payload"
          ditto "$APP_PATH" "$IPA_ROOT/Payload/LumaFrame.app"
          (cd "$IPA_ROOT" && zip -qry "$RUNNER_TEMP/LumaFrame-Unsigned.ipa" Payload)
          test -f "$RUNNER_TEMP/LumaFrame-Unsigned.ipa"

      - name: Upload unsigned IPA
        # The deliverable, and therefore the step that is allowed to fail the run. It is
        # placed before the log uploads for that reason: a flaky artifact service on a
        # diagnostics file must not cost the build the IPA.
        uses: actions/upload-artifact@v4
        with:
          name: LumaFrame-Unsigned-IPA
          path: ${{ runner.temp }}/LumaFrame-Unsigned.ipa
          if-no-files-found: error

      - name: Upload compiler diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: LumaFrame-Compiler-Diagnostics
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: warn
