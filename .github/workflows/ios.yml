name: iOS

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "fresh-rewrite"
      - "avfoundation-core"
    paths-ignore:
      - "android/**"
      - "docs/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "main"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    # macos-14 defaults to Xcode 15.4 and is unsupported from 2026-11-02.
    # macos-15 defaults to Xcode 16.4 and also has Xcode 26.3 installed.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify project file matches disk
        run: node scripts/generate-pbxproj.mjs --check

      - name: Validate project file structure
        run: node scripts/validate-pbxproj.mjs

      - name: Check Swift source balance
        run: node scripts/check-swift-balance.mjs

      - name: Select a simulator
        id: sim
        run: |
          set -euo pipefail
          xcodebuild -version
          UDID="$(xcrun simctl list devices available \
            | grep -E 'iPhone' \
            | grep -Eo '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' \
            | head -1)"
          if [ -z "$UDID" ]; then
            echo "no available iPhone simulator on this runner" >&2
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "using simulator $UDID"

      - name: Run unit tests
        run: |
          set -uo pipefail
          DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          set +e
          xcodebuild test \
            -project LumaFrame.xcodeproj \
            -scheme LumaFrame \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            grep -E "error:|failed|XCTAssert" "$RUNNER_TEMP/xcodebuild-test.log" || true
            exit "$STATUS"
          fi

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LumaFrame-iOS-Test-Log
          path: ${{ runner.temp }}/xcodebuild-test.log
          if-no-files-found: warn

  build:
    name: Build unsigned IPA
    needs: test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify Xcode toolchain and scheme
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -list -project LumaFrame.xcodeproj

      - name: Compile unsigned iOS application
        run: |
          set -euo pipefail
          DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          rm -rf "$DERIVED_DATA"
          set +e
          xcodebuild \
            -project LumaFrame.xcodeproj \
            -scheme LumaFrame \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_STATUS" -ne 0 ]; then
            {
              echo "### Swift compiler diagnostics"
              grep -E "error:|warning:" "$RUNNER_TEMP/xcodebuild.log" || true
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E "error:" "$RUNNER_TEMP/xcodebuild.log" | while IFS= read -r diagnostic; do
              printf '::error title=Swift compiler::%s\n' "$diagnostic"
            done
            exit "$BUILD_STATUS"
          fi

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LumaFrame-Compiler-Diagnostics
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: warn

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/LumaFrame.app"
          IPA_ROOT="$RUNNER_TEMP/UnsignedIPA"
          test -d "$APP_PATH"
          rm -rf "$IPA_ROOT"
          mkdir -p "$IPA_ROOT/Payload"
          ditto "$APP_PATH" "$IPA_ROOT/Payload/LumaFrame.app"
          (cd "$IPA_ROOT" && zip -qry "$RUNNER_TEMP/LumaFrame-Unsigned.ipa" Payload)
          test -f "$RUNNER_TEMP/LumaFrame-Unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: LumaFrame-Unsigned-IPA
          path: ${{ runner.temp }}/LumaFrame-Unsigned.ipa
          if-no-files-found: error
