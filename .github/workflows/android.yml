name: Android

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "fresh-rewrite"
      - "avfoundation-core"
    paths-ignore:
      - "App/**"
      - "docs/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "main"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # `ubuntu-latest` ships an Android SDK and sets ANDROID_HOME, but the command-line
      # tools are not on PATH, so `sdkmanager` exits 127 and the build never reaches
      # Gradle. `android-actions/setup-android` was doing that job and started failing in
      # its own right, so the PATH is set directly here instead: no third-party action,
      # and the locations are probed so a runner image change fails with a readable
      # message rather than a mystery.
      - name: Put the Android command-line tools on PATH
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          for candidate in \
            "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" \
            "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/bin" \
            "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" \
            "/opt/android-sdk/cmdline-tools/latest/bin"
          do
            if [ -x "$candidate/sdkmanager" ]; then
              echo "using $candidate"
              echo "$candidate" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          echo "sdkmanager not found in any known location" >&2
          find / -name sdkmanager -type f 2>/dev/null | head -5 >&2 || true
          exit 1

      # The Gradle wrapper JAR is a binary and is not committed. Installing the exact
      # pinned distribution keeps the build reproducible. Run `gradle wrapper` locally
      # and commit gradlew + gradle-wrapper.jar to remove this step.
      - name: Install pinned Gradle
        run: |
          set -euo pipefail
          GRADLE_VERSION="$(sed -n 's/^distributionUrl=.*gradle-\(.*\)-bin\.zip$/\1/p' gradle/wrapper/gradle-wrapper.properties)"
          echo "Gradle $GRADLE_VERSION"
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: |
          set -euo pipefail
          command -v sdkmanager > /dev/null
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-android-${{ hashFiles('android/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-android-

      - name: Run unit tests
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/gradle-test.log"
          set +e
          gradle --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            # Gradle fails for two very different reasons: a Kotlin compile error, which
            # starts with "e: ", and a build configuration or dependency resolution
            # failure, which says nothing of the sort. Reporting only the first kind
            # leaves the second looking like an unexplained red check, so both are
            # surfaced, and a run with neither falls back to the tail of the output.
            {
              echo "### Gradle diagnostics"
              grep -E "^e: |error:|FAILURE:|What went wrong|Could not |Caused by:|Execution failed|Unsupported|requires Gradle|minimum supported" "$LOG" \
                | sort -u | head -80 || true
              echo
              echo "<details><summary>Last 100 lines of Gradle output</summary>"
              echo
              echo '```'
              tail -n 100 "$LOG"
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"

            ERRORS="$(grep -E "^e: |FAILURE:|What went wrong|Could not |Unsupported" "$LOG" | sort -u || true)"
            if [ -n "$ERRORS" ]; then
              echo "$ERRORS" | head -20 | while IFS= read -r diagnostic; do
                printf '::error title=Gradle::%s\n' "$diagnostic"
              done
            else
              tail -n 60 "$LOG" | tr '\n' '\036' | sed 's/\x1E/\\n/g' | tr '\036' '\n' \
                | fold -w 900 | while IFS= read -r chunk; do
                  printf '::error title=Gradle output (tail)::%s\n' "$chunk"
                done
            fi
            exit "$STATUS"
          fi

      - name: Upload unit test log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: LumaFrame-Android-Test-Log
          path: ${{ runner.temp }}/gradle-test.log
          if-no-files-found: warn

      - name: Upload unit test results
        if: always()
        # Diagnostics, not a deliverable: an artifact service timeout must not fail the run.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: LumaFrame-Android-Test-Results
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
          if-no-files-found: warn

      - name: Assemble debug APK
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/gradle-apk.log"
          set +e
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            grep -E "^e: |FAILURE:|What went wrong|Could not |Unsupported" "$LOG" | sort -u | head -20 \
              | while IFS= read -r diagnostic; do
                printf '::error title=Gradle::%s\n' "$diagnostic"
              done
            exit "$STATUS"
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LumaFrame-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
