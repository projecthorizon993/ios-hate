name: iOS Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  pull_request:
    branches:
      - "main"

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify Xcode toolchain and scheme
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -list -project LumaFrame.xcodeproj

      - name: Compile unsigned iOS application
        run: |
          set -euo pipefail
          DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          rm -rf "$DERIVED_DATA"
          xcodebuild \
            -project LumaFrame.xcodeproj \
            -scheme LumaFrame \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/LumaFrame.app"
          IPA_ROOT="$RUNNER_TEMP/UnsignedIPA"
          test -d "$APP_PATH"
          rm -rf "$IPA_ROOT"
          mkdir -p "$IPA_ROOT/Payload"
          ditto "$APP_PATH" "$IPA_ROOT/Payload/LumaFrame.app"
          (cd "$IPA_ROOT" && zip -qry "$RUNNER_TEMP/LumaFrame-Unsigned.ipa" Payload)
          test -f "$RUNNER_TEMP/LumaFrame-Unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: LumaFrame-Unsigned-IPA
          path: ${{ runner.temp }}/LumaFrame-Unsigned.ipa
          if-no-files-found: error
